name: Build APK & Publish Update

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'hosting/**'
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${V%%+*}"  >> "$GITHUB_OUTPUT"
          echo "code=${V##*+}"  >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Stage hosting folder
        run: |
          mkdir -p hosting/appMeta
          cat > hosting/appMeta/latest.json <<EOF
          {
            "versionName": "${{ steps.ver.outputs.name }}",
            "versionCode": "${{ steps.ver.outputs.code }}",
            "apkUrl": "https://github.com/ridlofw/motorqu/releases/latest/download/app-release.apk",
            "notes": "Build otomatis $GITHUB_SHA",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Deploy metadata to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: motorqu-e81dd
          target: motorqu-e81dd

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: MotorQu v${{ steps.ver.outputs.name }}
          tag_name: v${{ steps.ver.outputs.name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
          body: |
            MotorQu v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
            Download APK → install → data tidak hilang.