name: Build APK & Publish Update

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # `secrets` is not allowed in step-level `if:`, so expose them as env first.
    env:
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${V%%+*}" >> "$GITHUB_OUTPUT"
          echo "code=${V##*+}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build APK
        id: build_apk
        run: flutter build apk --release

      - name: Write update metadata
        if: steps.build_apk.outcome == 'success'
        run: |
          mkdir -p release_assets hosting/appMeta
          cat > release_assets/latest.json <<EOF
          {
            "versionName": "${{ steps.ver.outputs.name }}",
            "versionCode": "${{ steps.ver.outputs.code }}",
            "apkUrl": "https://github.com/ridlofw/motorqu/releases/latest/download/app-release.apk",
            "notes": "Build otomatis ${GITHUB_SHA::7}",
            "updatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cp release_assets/latest.json hosting/appMeta/latest.json
          cat release_assets/latest.json

      - name: Publish GitHub Release (APK + metadata)
        if: steps.build_apk.outcome == 'success'
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: MotorQu v${{ steps.ver.outputs.name }}
          tag_name: v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            release_assets/latest.json
          overwrite_files: true
          make_latest: true
          body: |
            MotorQu v${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
            Unduh app-release.apk lalu install. Data tidak hilang.

      - name: Mirror metadata to Firebase Hosting
        if: steps.release.outcome == 'success' && env.HAS_FIREBASE_SA == 'true'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: motorqu-e81dd
          target: motorqu-e81dd
